[package]
name = "dessin-iced"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
authors.workspace = true

[dependencies]
dessin = { version = "^0.8.23", path = "../dessin" }
iced_core = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a02d62ae8c63d03e5411704b44c26d0d328d1620", default-features = false }
iced_widget = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a02d62ae8c63d03e5411704b44c26d0d328d1620", default-features = false, features = ["canvas", "image"] }
iced_graphics = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a02d62ae8c63d03e5411704b44c26d0d328d1620", default-features = false, features = ["image"] }
tracing = "0.1"

[dev-dependencies]
iced = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a02d62ae8c63d03e5411704b44c26d0d328d1620", features = [] }
