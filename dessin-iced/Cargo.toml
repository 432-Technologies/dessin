[package]
name = "dessin-iced"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
authors.workspace = true

[dependencies]
dessin = { version = "^0.8.23", path = "../dessin" }
iced_core = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a06d35d0f797c5b031ad19372320b1dc046a9f13", default-features = false }
iced_widget = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a06d35d0f797c5b031ad19372320b1dc046a9f13", default-features = false, features = ["canvas", "image"] }
iced_graphics = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a06d35d0f797c5b031ad19372320b1dc046a9f13", default-features = false, features = ["image"] }
tracing = "0.1"

[dev-dependencies]
iced = { git = "https://github.com/OlivierLemoine/iced.git", rev = "a06d35d0f797c5b031ad19372320b1dc046a9f13", features = [] }
